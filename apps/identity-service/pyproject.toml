[project]
name = "identity-service"
version = "0.1.0"
description = "Users, orgs, roles, invitations, sessions, MFA, API keys, and the audit log"
readme = "README.md"
authors = [
    { name = "Akhil Krishna", email = "akhilmavannoor@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "platform-auth",
    "platform-observability",
    "platform-secrets",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.12.5",
    "pyotp>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.scripts]
identity-service = "identity_service.main:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
platform-auth = { workspace = true }
platform-observability = { workspace = true }
platform-secrets = { workspace = true }
