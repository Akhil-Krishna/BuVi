[project]
name = "analytics-orchestrator"
version = "0.1.0"
description = "Conversations, analytics runs, the CrewAI AnalyticsFlow, ModelRouter and run events"
readme = "README.md"
authors = [
    { name = "Akhil Krishna", email = "akhilmavannoor@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.6.0",
    "asyncpg>=0.31.0",
    # Pinned: ADR 0006 accepts the chromadb advisories this exact release brings.
    "crewai==1.15.22",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "nats-py>=2.16.0",
    "platform-auth",
    "platform-contracts",
    "platform-observability",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.12.5",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    # Same parser and range as query-gateway: checks a chosen metric's output column exactly.
    "sqlglot>=30.18.0,<31",
    "uvicorn>=0.52.4",
]

[project.scripts]
analytics-orchestrator = "analytics_orchestrator.main:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
platform-auth = { workspace = true }
platform-contracts = { workspace = true }
platform-observability = { workspace = true }
