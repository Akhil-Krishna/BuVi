# Alembic configuration for semantic-service.
# One Alembic history per service (Section 5); this one owns the `semantic`
# schema and nothing else. The URL is supplied by `migrations/env.py` from
# SEMANTIC_MIGRATION_DSN so no credential is written into this file.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
