[project]
name = "query-gateway"
version = "0.1.0"
description = "SQL validation, policy, read-only execution, result handles and query audit (Section 13)"
readme = "README.md"
authors = [
    { name = "Akhil Krishna", email = "akhilmavannoor@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    # MySQL connector (Phase A8); PyMySQL underneath.
    "aiomysql>=0.2.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "platform-auth",
    "platform-egress",
    "platform-observability",
    "platform-secrets",
    "pydantic-settings>=2.15.0",
    "pydantic>=2.12.5",
    "sqlalchemy[asyncio]>=2.0.52",
    "sqlglot>=30.18.0,<31",
    "uvicorn>=0.52.4",
    "redis>=8.1.0",
]

[project.scripts]
query-gateway = "query_gateway.main:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
platform-auth = { workspace = true }
platform-egress = { workspace = true }
platform-observability = { workspace = true }
platform-secrets = { workspace = true }
