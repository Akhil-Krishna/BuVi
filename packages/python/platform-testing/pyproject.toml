[project]
name = "platform-testing"
version = "0.1.0"
description = "Shared pytest fixtures: testcontainers, factories, and demo principals"
readme = "README.md"
authors = [
    { name = "Akhil Krishna", email = "akhilmavannoor@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymysql>=1.1.0",
    "testcontainers>=4.13.1",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
