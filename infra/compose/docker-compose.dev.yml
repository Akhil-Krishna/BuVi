# Local development environment (Section 27 of the build spec).
#
# `make up` brings up Postgres, Redis, NATS, Keycloak, Vault, MinIO, MailHog and
# the OTel collector. Every credential here is a throwaway development value --
# nothing in this file is used outside a developer laptop or CI.
#
# Deviation from the Section 27 listing, recorded in ADR 0002:
#   * the obsolete top-level `version:` key is dropped (Compose v2 warns on it);
#   * health checks and an `identity`-schema init script are added so `make up`
#     is usable as a test fixture rather than merely "the containers started";
#   * sample-sales-db mounts a seed script for its `sales` schema (ADR 0004).

name: buvi-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: agentic_bi
    ports: ["5432:5432"]
    volumes:
      - "pgdata:/var/lib/postgresql/data"
      - "./postgres-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentic_bi"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--health-enabled=true"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports: ["8080:8080"]
    healthcheck:
      # The Keycloak image ships no curl/wget; use its bundled JRE to probe.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r' >&3 &&
          cat <&3 | grep -q '\"status\": \"UP\"'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  vault:
    image: hashicorp/vault:1.17
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: devroot
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports: ["8200:8200"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Section 27 names `minio/minio`; that Docker Hub repository no longer
    # serves pulls. quay.io is MinIO's published registry (ADR 0002).
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailhog:
    image: mailhog/mailhog
    ports: ["8025:8025", "1025:1025"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["4317:4317", "4318:4318"]

  # Sample DB the platform connects to as a customer data source, for the first
  # vertical slice (Phase A3 onward).
  sample-sales-mysql:
    # A customer's MySQL 8 for Phase A8 (same data as sample-sales-db). LOCAL INFILE is off
    # server-side too; the platform connects as the SELECT-only `buvi_reader`.
    image: mysql:8.4
    command: ["--local-infile=0", "--character-set-server=utf8mb4"]
    environment:
      MYSQL_ROOT_PASSWORD: sales
    ports: ["3307:3306"]
    volumes:
      - "./sample-sales-mysql-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -psales --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  sample-sales-db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: sales
      POSTGRES_DB: sample_sales
    ports: ["5433:5432"]
    # Seeds the `sales` schema and the read-only `buvi_reader` role on a fresh
    # container; `scripts/seed-sample-sales.sh` re-applies it to an existing one.
    volumes:
      - "./sample-sales-init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sample_sales"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
